services:
  - type: web
    name: attendance-app
    env: python
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CR_EMAILS
        sync: false
